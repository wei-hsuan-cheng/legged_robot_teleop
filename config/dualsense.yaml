base_twist_teleop:
  ros__parameters:
    publish_rate: 100.0
    neutral_threshold: 0.1
    stick_exponent: 2.0 # sign(x)|x|^2: fine control near center, same full-stick speed (1.0 = linear).

    # game_controller_node already uses ROS signs: forward and left are positive.
    axis_forward: 1
    axis_lateral: 0
    axis_yaw: 2
    axis_enable: 4 # L2 trigger, not the L1 shoulder button.
    sign_forward: 1.0
    sign_lateral: 1.0
    sign_yaw: 1.0
    sign_enable: -1.0 # game_controller_node reports L2 from 0 released to -1 pressed.
    enable_threshold: 0.5 # Engage at 50% of the ROS trigger range.
    release_threshold: 0.2 # Disengage at 20%; hysteresis prevents threshold chatter.

    # Fractions of the MPC's configured maximum speeds, not m/s or rad/s.
    scale_forward: 1.0
    scale_lateral: 1.0
    scale_yaw: 1.0

    button_height_up: 11 # D-pad up, while L2 is held.
    button_height_down: 12 # D-pad down, while L2 is held.
    button_center: 9 # L1: zero motion, nominal height and level trunk, only with L2 released.
    button_roll_left: 13 # D-pad left: lean the trunk left, while L2 is held (robots with a commanded roll).
    button_roll_right: 14 # D-pad right: lean the trunk right, while L2 is held.
    button_posture: 2 # Square (SDL X): stand/sit toggle, only with L2 released.
    button_gait_cycle: 1 # Circle (SDL B): walk -> trot -> wheel_drive, in locomotion (robots with a planned stand-up).
    button_gait_hold: 3 # Triangle (SDL Y): jump while held, in locomotion.
    height_rate: 0.2 # m/s; heights and bounds come from the robot controller YAML.
    roll_rate: 0.3 # rad/s; the roll limit (ocs2.reference.maxBaseRoll) comes from the robot controller YAML.
